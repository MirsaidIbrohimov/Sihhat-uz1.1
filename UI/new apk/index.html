<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sihhat.uz APK — Yangi UI Galereyasi (T5 Zumrad & Aqua / T6 Aurora)</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        src: url("../../apps/superadmin-web/public/fonts/DMSans.ttf") format("truetype");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Manrope";
        src: url("../../apps/superadmin-web/public/fonts/Manrope.ttf") format("truetype");
        font-weight: 100 900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, sans-serif;
        color: #ecfdf7;
        min-height: 100vh;
        transition: background 0.25s ease;
      }
      body.theme-t5 {
        background:
          radial-gradient(960px 520px at 8% -6%, rgba(16, 185, 129, 0.24), transparent 58%),
          radial-gradient(840px 480px at 94% 100%, rgba(34, 211, 238, 0.18), transparent 58%),
          #061b18;
      }
      body.theme-t6 {
        background:
          radial-gradient(960px 520px at 8% -6%, rgba(99, 102, 241, 0.22), transparent 58%),
          radial-gradient(840px 480px at 94% 100%, rgba(16, 185, 129, 0.18), transparent 58%),
          #0a0f1f;
      }
      header {
        position: sticky; top: 0; z-index: 20;
        background: rgba(8, 34, 30, 0.94);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(52, 211, 153, 0.24);
        padding: 14px 24px;
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      }
      body.theme-t6 header {
        background: rgba(14, 21, 42, 0.94);
        border-bottom-color: rgba(129, 140, 248, 0.24);
      }
      .title h1 { margin: 0; font-family: Manrope, sans-serif; font-size: 18px; font-weight: 800; }
      .title p { margin: 2px 0 0; font-size: 12.5px; color: #7bb3a2; }
      body.theme-t6 .title p { color: #8799bf; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .theme-switch {
        display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px;
        background: rgba(4, 19, 17, 0.85); border: 1px solid rgba(110, 231, 183, 0.3);
      }
      body.theme-t6 .theme-switch {
        background: rgba(10, 15, 31, 0.85); border-color: rgba(129, 140, 248, 0.3);
      }
      .tbtn {
        display: inline-flex; align-items: center; gap: 6px;
        border: 0; background: transparent; color: #cbd5e1;
        padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer;
      }
      .tbtn.active.t5 { background: linear-gradient(135deg, #10b981, #06b6d4); color: #fff; }
      .tbtn.active.t6 { background: linear-gradient(135deg, #6366f1, #0ea5e9); color: #fff; }
      .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
      .tab {
        border: 1px solid rgba(52, 211, 153, 0.24); background: #0d2c27; color: #d1fae5;
        padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer;
      }
      body.theme-t6 .tab { border-color: rgba(129, 140, 248, 0.24); background: #141d38; color: #cbd5e1; }
      .tab.active { background: linear-gradient(135deg, #10b981, #06b6d4); color: #fff; border-color: transparent; }
      body.theme-t6 .tab.active { background: linear-gradient(135deg, #6366f1, #0ea5e9); }
      main { max-width: 1560px; margin: 20px auto 48px; padding: 0 24px; }
      .frame {
        background: rgba(13, 44, 39, 0.9);
        border: 1px solid rgba(52, 211, 153, 0.26);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 22px 54px rgba(1, 14, 12, 0.55);
      }
      body.theme-t6 .frame { background: rgba(20, 29, 56, 0.9); border-color: rgba(129, 140, 248, 0.24); }
      .img-wrap { overflow: auto; background: #041311; text-align: center; }
      body.theme-t6 .img-wrap { background: #070b18; }
      .img-wrap img { width: 100%; height: auto; display: block; cursor: zoom-in; }
      .img-wrap.zoom img { width: auto; max-width: none; cursor: zoom-out; }
      .bar {
        padding: 14px 20px;
        border-top: 1px solid rgba(52, 211, 153, 0.22);
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      }
      body.theme-t6 .bar { border-top-color: rgba(129, 140, 248, 0.2); }
      .bar strong { font-family: Manrope, sans-serif; font-size: 15px; color: #f8fafc; }
      .bar span { font-size: 12.5px; color: #7bb3a2; }
      body.theme-t6 .bar span { color: #93a7cc; }
      .actions { display: flex; gap: 8px; }
      .btn {
        padding: 7px 13px; border-radius: 999px;
        background: #133a34; border: 1px solid rgba(110, 231, 183, 0.34);
        color: #d1fae5; font-size: 12.5px; font-weight: 700; text-decoration: none; cursor: pointer;
      }
      body.theme-t6 .btn { background: #1c284a; border-color: rgba(125, 211, 252, 0.3); color: #e0f2fe; }
    </style>
  </head>
  <body class="theme-t5">
    <header>
      <div class="title">
        <h1 id="pageTitle">Sihhat.uz APK — T5 Zumrad & Aqua UI (18 ta ekran)</h1>
        <p>T5 va T6 palitralarini 1-klikda solishtiring · ← / → tugmalari bilan almashadi</p>
      </div>
      <div class="controls">
        <div class="theme-switch">
          <button class="tbtn t5 active" id="btnT5" onclick="setTheme('T5')"><span class="dot" style="background:linear-gradient(135deg,#10b981,#22d3ee)"></span>T5 · Zumrad & Aqua</button>
          <button class="tbtn t6" id="btnT6" onclick="setTheme('T6')"><span class="dot" style="background:linear-gradient(135deg,#6366f1,#38bdf8)"></span>T6 · Tungi Aurora</button>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>
    </header>
    <main>
      <div class="frame">
        <div class="img-wrap" id="wrap">
          <img id="preview" alt="" onclick="toggleZoom()" />
        </div>
        <div class="bar">
          <div><strong id="name"></strong> · <span id="desc"></span></div>
          <div class="actions">
            <button class="btn" id="zoomBtn" onclick="toggleZoom()">🔍 1:1 Kattalashtirish</button>
            <a class="btn" id="dl" download>PNG yuklab olish</a>
          </div>
        </div>
      </div>
    </main>
    <script>
      const SETS = {
        T5: [
          { file: "T5/00-apk-barcha-ekranlar-t5.png", label: "00 · Barchasi (12)", name: "T5 Zumrad & Aqua — Barcha 12 ta asosiy APK ekrani", desc: "Chuqur Zumrad (#061B18) + Emerald/Aqua (#10B981 → #22D3EE) umumiy posteri" },
          { file: "T5/01-bosh-sahifa-va-katalog.png", label: "01 · Bosh sahifa", name: "T5 · 01 — Bosh sahifa, Katalog va Tafsilot", desc: "Hero, 4 yo‘nalish surati, «Qaysi dardga davo?» va kunlik tartib" },
          { file: "T5/02-xonalar-bron-va-tolov.png", label: "02 · Xonalar & To‘lov", name: "T5 · 02 — Xonalar, Jonli kalkulyator va TezCheck", desc: "Butun xona / 1 kishilik joy, 3–14 kun kalkulyatori va 0% komissiya" },
          { file: "T5/03-bronlar-qr-va-kundalik.png", label: "03 · Bronlar & QR", name: "T5 · 03 — Bronlarim, QR-Vaucher va Kundalik", desc: "5 xonali BR-48219 qidiruvi, internetsiz kesh, QR chipta va kundalik" },
          { file: "T5/04-ai-maslahatchi-va-taqqoslash.png", label: "04 · AI & Taqqoslash", name: "T5 · 04 — AI Maslahatchi va Taqqoslash", desc: "T5 Zumrad-Aqua neon AI robot, katalog tavsiyalari va solishtirish" },
          { file: "T5/05-yordam-chat-va-bildirishnoma.png", label: "05 · Yordam & Push", name: "T5 · 05 — Markaziy Yordam, Chat va FCM Push", desc: "Superadmin jonli chati, rasm biriktirish va FCM Push bildirishnomalar" },
          { file: "T5/06-profil-kirish-va-kunduzgi-y3.png", label: "06 · Profil & Y3", name: "T5 · 06 — Profil (#ID), Kirish/OTP va Y3 Kunduzgi rejim", desc: "6 xonali #ID, +998 OTP kirish va oq/zumrad Y3 kunduzgi ko‘rinish" },
        ],
        T6: [
          { file: "00-apk-barcha-ekranlar-t6.png", label: "00 · Barchasi (12)", name: "T6 Tungi Aurora — Barcha 12 ta asosiy APK ekrani", desc: "Midnight Indigo (#0A0F1F) + Indigo/Sky/Mint umumiy posteri" },
          { file: "01-bosh-sahifa-va-katalog.png", label: "01 · Bosh sahifa", name: "T6 · 01 — Bosh sahifa, Katalog va Tafsilot", desc: "Hero, 4 yo‘nalish surati, «Qaysi dardga davo?» va kunlik tartib" },
          { file: "02-xonalar-bron-va-tolov.png", label: "02 · Xonalar & To‘lov", name: "T6 · 02 — Xonalar, Jonli kalkulyator va TezCheck", desc: "Butun xona / 1 kishilik joy, 3–14 kun kalkulyatori va 0% komissiya" },
          { file: "03-bronlar-qr-va-kundalik.png", label: "03 · Bronlar & QR", name: "T6 · 03 — Bronlarim, QR-Vaucher va Kundalik", desc: "5 xonali BR-48219 qidiruvi, internetsiz kesh, QR chipta va kundalik" },
          { file: "04-ai-maslahatchi-va-taqqoslash.png", label: "04 · AI & Taqqoslash", name: "T6 · 04 — AI Maslahatchi va Taqqoslash", desc: "T6 Aurora neon AI robot, katalog tavsiyalari va solishtirish" },
          { file: "05-yordam-chat-va-bildirishnoma.png", label: "05 · Yordam & Push", name: "T6 · 05 — Markaziy Yordam, Chat va FCM Push", desc: "Superadmin jonli chati, rasm biriktirish va FCM Push bildirishnomalar" },
          { file: "06-profil-kirish-va-kunduzgi-y6.png", label: "06 · Profil & Y6", name: "T6 · 06 — Profil (#ID), Kirish/OTP va Y6 Kunduzgi rejim", desc: "6 xonali #ID, +998 OTP kirish va oq/indigo Y6 kunduzgi ko‘rinish" },
        ],
      };
      let theme = "T5", idx = 0, zoomed = false;
      function render() {
        const list = SETS[theme];
        const it = list[idx];
        document.body.className = theme === "T5" ? "theme-t5" : "theme-t6";
        document.getElementById("pageTitle").textContent =
          theme === "T5"
            ? "Sihhat.uz APK — T5 Zumrad & Aqua UI (18 ta ekran)"
            : "Sihhat.uz APK — T6 Tungi Aurora UI (18 ta ekran)";
        document.getElementById("btnT5").className = "tbtn t5" + (theme === "T5" ? " active" : "");
        document.getElementById("btnT6").className = "tbtn t6" + (theme === "T6" ? " active" : "");
        document.getElementById("preview").src = it.file;
        document.getElementById("name").textContent = it.name;
        document.getElementById("desc").textContent = it.desc;
        document.getElementById("dl").href = it.file;
        document.getElementById("wrap").className = "img-wrap" + (zoomed ? " zoom" : "");
        document.getElementById("zoomBtn").textContent = zoomed ? "↩️ Ekranga moslash" : "🔍 1:1 Kattalashtirish";
        document.getElementById("tabs").innerHTML = list.map((x, n) =>
          `<button class="tab ${n === idx ? "active" : ""}" onclick="show(${n})">${x.label}</button>`
        ).join("");
      }
      window.setTheme = (t) => { theme = t; zoomed = false; render(); };
      window.show = (i) => { idx = (i + SETS[theme].length) % SETS[theme].length; zoomed = false; render(); };
      window.toggleZoom = () => { zoomed = !zoomed; render(); };
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") window.show(idx + 1);
        if (e.key === "ArrowLeft") window.show(idx - 1);
        if (e.key === "Escape" && zoomed) window.toggleZoom();
      });
      render();
    </script>
  </body>
</html>
