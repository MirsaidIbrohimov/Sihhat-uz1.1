<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#1d2b58"/>
      <stop offset="55%" stop-color="#0d1429"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>
    <linearGradient id="auroraSphere3" x1="12%" y1="12%" x2="88%" y2="88%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="48%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glassSurface3" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="42%" stop-color="#93c5fd" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0a0f1f" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glassRim3" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.56"/>
    </linearGradient>
    <linearGradient id="leaf3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="orbitPulse3" x1="320" y1="590" x2="736" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="28%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="1"/>
    </linearGradient>
    <filter id="bigGlow3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="cardDrop3" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#02040d" flood-opacity="0.65"/>
    </filter>
    <filter id="softGlow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg3)"/>

  <circle cx="448" cy="346" r="190" fill="#6366f1" fill-opacity="0.48" filter="url(#bigGlow3)"/>
  <circle cx="586" cy="462" r="185" fill="#10b981" fill-opacity="0.42" filter="url(#bigGlow3)"/>
  <circle cx="536" cy="370" r="160" fill="#0ea5e9" fill-opacity="0.45" filter="url(#bigGlow3)"/>

  <g filter="url(#cardDrop3)">
    <circle cx="512" cy="404" r="258" fill="url(#auroraSphere3)"/>
    <circle cx="512" cy="404" r="232" fill="#0d152c" fill-opacity="0.62"/>
    <circle cx="512" cy="404" r="232" fill="url(#glassSurface3)" stroke="url(#glassRim3)" stroke-width="5"/>
    <path d="M 326,312 A 212,212 0 0,1 698,312 A 240,145 0 0,0 326,312 Z" fill="#ffffff" fill-opacity="0.14"/>
  </g>

  <g filter="url(#cardDrop3)">
    <rect x="458" y="232" width="108" height="332" rx="40" fill="#ffffff"/>
    <rect x="346" y="344" width="332" height="108" rx="40" fill="#ffffff"/>

    <path d="M 484,548 C 492,456 544,368 686,288 C 660,398 598,476 484,548 Z" fill="url(#leaf3)"/>
    <path d="M 504,524 C 556,456 610,382 670,308" fill="none" stroke="#ffffff" stroke-opacity="0.88" stroke-width="5" stroke-linecap="round"/>

    <circle cx="512" cy="344" r="22" fill="#0e152a"/>
    <circle cx="512" cy="344" r="13" fill="#38bdf8"/>
    <path d="M 442,386 C 476,396 498,414 512,448 C 526,414 548,396 582,386 C 546,416 524,442 512,478 C 500,442 478,416 442,386 Z" fill="#0e152a"/>
  </g>

  <!-- Smoothly Fading Orbital Pulse Ribbon -->
  <g filter="url(#softGlow3)">
    <path d="M 326,564 Q 428,616 524,598 L 552,598 L 570,564 L 592,630 L 618,522 L 642,636 L 664,580 L 682,598 L 728,598"
      fill="none" stroke="url(#orbitPulse3)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="732" cy="598" r="10" fill="#6ee7b7"/>
  </g>

  <text x="512" y="838" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="112" font-weight="800" letter-spacing="-3">
    <tspan fill="#ffffff">Sihhat</tspan><tspan fill="#38bdf8">.</tspan><tspan fill="#34d399">uz</tspan>
  </text>
  <text x="512" y="896" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="6.5" fill="#93c5fd" fill-opacity="0.82">
    SANATORIYALAR EKOTIZIMI
  </text>
</svg>