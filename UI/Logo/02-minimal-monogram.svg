<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121b38"/>
      <stop offset="55%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="gCross2" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="48%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gSkyMint2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gMint2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="line2" x1="372" y1="868" x2="652" y2="868" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020510" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg2)"/>
  <circle cx="480" cy="380" r="230" fill="#6366f1" fill-opacity="0.16" filter="url(#glow2)"/>
  <circle cx="590" cy="450" r="180" fill="#10b981" fill-opacity="0.12" filter="url(#glow2)"/>
  <rect x="18" y="18" width="988" height="988" rx="214" fill="none" stroke="url(#gSkyMint2)" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Geometric Rounded Squircle Container Mark -->
  <g filter="url(#drop2)">
    <rect x="262" y="150" width="500" height="500" rx="146" fill="#141d38" stroke="url(#gSkyMint2)" stroke-opacity="0.48" stroke-width="4"/>

    <!-- Unified Silky Rounded Cross Core (zero jagged center seams!) -->
    <path d="
      M 454,234
      C 454,208 474,188 500,188
      L 524,188
      C 550,188 570,208 570,234
      L 570,318
      C 570,331 581,342 594,342
      L 660,342
      C 684,342 704,362 704,386
      L 704,414
      C 704,438 684,458 660,458
      L 594,458
      C 581,458 570,469 570,482
      L 570,566
      C 570,592 550,612 524,612
      L 500,612
      C 474,612 454,592 454,566
      L 454,482
      C 454,469 443,458 430,458
      L 346,458
      C 320,458 300,438 300,412
      L 300,388
      C 300,362 320,342 346,342
      L 430,342
      C 443,342 454,331 454,318
      Z" fill="url(#gCross2)"/>

    <!-- Vibrant Sculpted Mint Leaf Overlapping Right Wing -->
    <path d="
      M 504,478
      C 514,384 584,318 724,312
      C 712,414 646,482 536,484
      Z" fill="url(#gMint2)"/>
    <path d="M 526,464 C 584,410 644,362 702,328" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Crisp White Negative-Space Rising Wellness Human -->
    <circle cx="512" cy="340" r="26" fill="#ffffff"/>
    <path d="M 426,392 C 468,402 496,424 512,468 C 528,424 556,402 598,392 C 556,424 532,452 512,502 C 492,452 468,424 426,392 Z" fill="#ffffff"/>

    <!-- Minimal Crisp Heartbeat Accent across lower-right -->
    <polyline
      points="544,548 594,548 614,508 636,580 660,486 684,548 718,548"
      fill="none"
      stroke="#ffffff"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="722" cy="548" r="9.5" fill="#34d399"/>
  </g>

  <text x="512" y="830" text-anchor="middle" font-family="Manrope, system-ui, sans-serif" font-size="116" font-weight="800" letter-spacing="-4">
    <tspan fill="#f1f5ff">sihhat</tspan><tspan fill="url(#gSkyMint2)">.uz</tspan>
  </text>
  <rect x="372" y="866" width="280" height="7" rx="3.5" fill="url(#line2)"/>
</svg>