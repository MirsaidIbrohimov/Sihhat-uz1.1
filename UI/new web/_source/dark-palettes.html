<html lang="uz" data-theme="dark">

    <style>
      /* 100% Zero-White Full Dark Surface Overrides */
      .stage, .app-shell {
        background: var(--canvas-bg) !important;
      }
      .sidebar {
        background: var(--sidebar-bg) !important;
        border-right: 1px solid var(--border) !important;
      }
      .topbar {
        background: var(--topbar-bg) !important;
        border-bottom: 1px solid var(--border) !important;
      }
      .card, .kpi-card {
        background: var(--card-bg) !important;
        border: 1px solid var(--border) !important;
        box-shadow: var(--card-shadow) !important;
      }
      .card-head {
        border-bottom-color: var(--border) !important;
      }
      .kv-row, .cmd-search, .select-pill, .icon-btn, .user-pill, .sb-foot-card, .segmented, .btn.secondary {
        background: var(--surface-2) !important;
        border-color: var(--border) !important;
        color: var(--ink) !important;
      }
      .cmd-search, .select-pill { color: var(--muted) !important; }
      .select-pill { color: var(--ink-2) !important; }
      .cmd-search kbd {
        background: var(--card-bg) !important;
        border-color: var(--border-strong) !important;
        color: var(--muted) !important;
      }
      .seg-item { color: var(--muted) !important; }
      .seg-item.active {
        background: var(--accent-soft-2) !important;
        color: var(--accent-bright) !important;
        box-shadow: inset 0 0 0 1px var(--accent-border);
      }
      .btn.primary {
        background: var(--btn-grad) !important;
        color: #ffffff !important;
        border-color: transparent !important;
        box-shadow: var(--btn-shadow) !important;
      }
      .sb-brand, .sb-footer { border-color: var(--border) !important; }
      .sb-item { color: var(--ink-2) !important; }
      .sb-item svg { color: var(--muted) !important; }
      .sb-item.active {
        background: var(--sb-active-bg) !important;
        color: var(--accent-bright) !important;
        box-shadow: inset 0 0 0 1px var(--accent-border);
      }
      .sb-item.active svg { color: var(--accent-bright) !important; }
      .sb-item.active::before {
        background: var(--btn-grad) !important;
        width: 3.5px;
      }
      .sb-badge {
        background: var(--surface-2) !important;
        color: var(--ink-2) !important;
        border-color: var(--border) !important;
      }
      .sb-badge.warn {
        background: rgba(245, 158, 11, 0.18) !important;
        color: #fcd34d !important;
        border-color: rgba(245, 158, 11, 0.35) !important;
      }
      .sb-badge.accent {
        background: var(--btn-grad) !important;
        color: #ffffff !important;
        border-color: transparent !important;
      }
      .sb-badge.live {
        background: rgba(16, 185, 129, 0.18) !important;
        color: #6ee7b7 !important;
        border-color: rgba(16, 185, 129, 0.36) !important;
      }
      .sb-role-pill {
        background: var(--accent-soft) !important;
        color: var(--accent-bright) !important;
        border-color: var(--accent-border) !important;
      }
      .sb-foot-icon {
        background: var(--accent-soft) !important;
        color: var(--accent-bright) !important;
      }
      .kpi-icon.c1 { background: var(--ic1-bg) !important; color: var(--ic1-ink) !important; border: 1px solid var(--ic1-bd); }
      .kpi-icon.c2 { background: var(--ic2-bg) !important; color: var(--ic2-ink) !important; border: 1px solid var(--ic2-bd); }
      .kpi-icon.c3 { background: var(--ic3-bg) !important; color: var(--ic3-ink) !important; border: 1px solid var(--ic3-bd); }

      .kpi-card.accent {
        background: var(--kpi-featured-bg) !important;
        border: 1px solid var(--kpi-featured-bd) !important;
        box-shadow: var(--kpi-featured-shadow) !important;
      }
      .kpi-card.accent .kpi-icon {
        background: rgba(255, 255, 255, 0.18) !important;
        color: #ffffff !important;
      }
      .kpi-card.accent .delta {
        background: rgba(255, 255, 255, 0.2) !important;
        color: #ffffff !important;
      }
      .bar-track {
        background: var(--surface-2) !important;
        border-color: var(--border) !important;
      }
      .bar-fill {
        background: var(--bar-grad) !important;
        box-shadow: var(--bar-glow);
      }
      .avatar {
        background: var(--btn-grad) !important;
      }
      .online-ring { border-color: var(--sidebar-bg) !important; }
      .notif-dot { border-color: var(--surface-2) !important; }
      .delta.neutral {
        background: var(--surface-2) !important;
        color: var(--ink-2) !important;
        border: 1px solid var(--border);
      }
      .ai-tile {
        padding: 10px;
        border-radius: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        text-align: center;
      }
      .palette-ribbon {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        color: var(--accent-bright);
        font-size: 11.5px;
        font-weight: 700;
        white-space: nowrap;
      }
      .swatch-dots { display: inline-flex; align-items: center; gap: 4px; }
      .swatch-dots i {
        width: 10px; height: 10px; border-radius: 50%;
        display: inline-block; border: 1px solid rgba(255, 255, 255, 0.25);
      }

      /* 3x2 Dark Comparison Board (Zero White) */
      .cmp-stage {
        width: 1600px; height: 1040px; padding: 24px 28px;
        background: radial-gradient(1000px 520px at 10% 0%, rgba(99, 102, 241, 0.16), transparent 60%),
                    radial-gradient(900px 520px at 95% 100%, rgba(14, 165, 233, 0.14), transparent 60%),
                    #090b12;
        display: flex; flex-direction: column; gap: 16px;
      }
      .cmp-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
        gap: 16px; flex: 1; min-height: 0;
      }
      .cmp-card {
        background: #121624; border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 16px;
        overflow: hidden; display: flex; flex-direction: column;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
      .cmp-thumb {
        flex: 1; min-height: 0; overflow: hidden; background: #0a0d16;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14); display: flex; align-items: center; justify-content: center; padding: 4px;
      }
      .cmp-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 8px; }
      .cmp-meta {
        padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      }
      .cmp-meta strong { font-family: Manrope, sans-serif; font-size: 13.5px; font-weight: 800; color: #f1f5f9; display: block; }
      .cmp-meta span { font-size: 11.5px; color: #94a3b8; }

          } else {
            const p = PALETTES[id] || PALETTES["T1-tungi-yorqin-indigo"];
            Object.entries(p.vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
            stage.innerHTML = renderDashboard(p);
          }
          document.body.setAttribute("data-ready", "true");
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
