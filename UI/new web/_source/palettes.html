    <style>
      /* Palette-override hooks */
      .kpi-card.accent {
        background: var(--kpi-featured-bg) !important;
        border-color: var(--kpi-featured-border, transparent) !important;
      }
      .kpi-card.accent .kpi-icon {
        background: var(--kpi-featured-icon-bg, rgba(255,255,255,0.15)) !important;
        color: var(--kpi-featured-icon-ink, #ffffff) !important;
      }
      .kpi-card.accent .delta {
        background: var(--kpi-featured-delta-bg, rgba(255,255,255,0.18)) !important;
        color: var(--kpi-featured-delta-ink, #ffffff) !important;
      }
      .avatar {
        background: var(--avatar-grad, linear-gradient(135deg, var(--accent), var(--accent-bright))) !important;
      }
      .sidebar {
        background: var(--sidebar) !important;
        border-right-color: var(--sb-border, var(--border)) !important;
      }
      .sidebar .brand-name { color: var(--sb-ink, var(--ink)) !important; }
      .sidebar .brand-sub { color: var(--sb-muted, var(--muted)) !important; }
      .sidebar .sb-brand { border-bottom-color: var(--sb-border, var(--border)) !important; }
      .sidebar .sb-group-title { color: var(--sb-group, var(--muted-2)) !important; }
      .sidebar .sb-item { color: var(--sb-item-ink, var(--ink-2)) !important; }
      .sidebar .sb-item svg { color: var(--sb-item-icon, var(--muted)) !important; }
      .sidebar .sb-item.active {
        background: var(--sb-active-bg, var(--accent-soft)) !important;
        color: var(--sb-active-ink, var(--accent-deep)) !important;
      }
      .sidebar .sb-item.active svg { color: var(--sb-active-icon, var(--accent)) !important; }
      .sidebar .sb-item.active::before { background: var(--sb-active-bar, var(--accent)) !important; }
      .sidebar .sb-badge {
        background: var(--sb-badge-bg, var(--card-subtle));
        color: var(--sb-badge-ink, var(--muted));
        border-color: var(--sb-badge-border, var(--border));
      }
      .sidebar .sb-badge.warn {
        background: var(--warn-bg);
        color: var(--warn-ink);
        border-color: var(--warn-border);
      }
      .sidebar .sb-badge.accent {
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      .sidebar .sb-badge.live {
        background: var(--ok-bg);
        color: var(--ok-ink);
        border-color: var(--ok-border);
      }
      .sidebar .sb-footer { border-top-color: var(--sb-border, var(--border)) !important; }
      .sidebar .sb-foot-card {
        background: var(--sb-foot-bg, var(--card-subtle)) !important;
        border-color: var(--sb-border, var(--border)) !important;
      }
      .sidebar .sb-foot-card strong { color: var(--sb-ink, var(--ink)) !important; }
      .sidebar .sb-foot-card span { color: var(--sb-muted, var(--muted)) !important; }
      .sidebar .sb-foot-icon {
        background: var(--sb-active-bg, var(--accent-soft)) !important;
        color: var(--sb-active-icon, var(--accent)) !important;
      }
      .sidebar .sb-role-pill {
        background: var(--sb-role-bg, var(--accent-soft)) !important;
        color: var(--sb-role-ink, var(--accent)) !important;
        border-color: var(--sb-role-border, var(--accent-border)) !important;
      }
      .palette-ribbon {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        color: var(--accent-deep);
        font-size: 11.5px;
        font-weight: 700;
        white-space: nowrap;
      }
      :root[data-theme="dark"] .palette-ribbon {
        color: var(--accent-bright);
      }
      .swatch-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .swatch-dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        border: 1px solid rgba(0, 0, 0, 0.14);
      }

      /* Comparison 3x2 Board */
      .cmp-stage {
        width: 1600px;
        height: 1040px;
        padding: 24px 28px;
        background: #f3f4f6;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .cmp-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .cmp-card {
        background: #ffffff;
        border: 1px solid #e2e6ea;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      }
      .cmp-thumb {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #f8fafc;
        border-bottom: 1px solid #e2e6ea;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
      }
      .cmp-thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        border-radius: 8px;
      }
      .cmp-meta {
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .cmp-meta strong {
        font-family: Manrope, sans-serif;
        font-size: 13.5px;
        font-weight: 800;
        color: #0f172a;
        display: block;
      }
      .cmp-meta span {
        font-size: 11.5px;
        color: #64748b;
      }
    </style>

                  </div>`
                  )
                  .join("")}

          `;
        }

        function boot() {
          const q = new URLSearchParams(location.search);
          const id = q.get("palette") || "A-moviy-klinika-sapphire";
          const stage = document.getElementById("stage");
          if (id === "compare") {
            document.documentElement.setAttribute("data-theme", "light");
            stage.innerHTML = renderComparison();
          } else {
            const p = PALETTES[id] || PALETTES["A-moviy-klinika-sapphire"];
            document.documentElement.setAttribute("data-theme", p.dark ? "dark" : "light");
            Object.entries(p.vars).forEach(([k, v]) => {
              document.documentElement.style.setProperty(k, v);
            });
            stage.innerHTML = renderDashboard(p);
          }
          document.body.setAttribute("data-ready", "true");
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
