    <script src="../../web/assets/icons.js" defer></script>
    <style>
      .stage, .app-shell {
        background: var(--canvas-bg, var(--canvas)) !important;
      }
      .sidebar {
        background: rgba(255, 255, 255, 0.92) !important;
        border-right-color: var(--border) !important;
      }
      .topbar {
        background: rgba(255, 255, 255, 0.88) !important;
        border-bottom-color: var(--border) !important;
      }
      .card, .kpi-card {
        background: rgba(255, 255, 255, 0.96) !important;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.045), 0 1px 2px rgba(15, 23, 42, 0.03) !important;
      }
      .btn.primary {
        background: var(--btn-grad, var(--accent)) !important;
        box-shadow: var(--btn-shadow, 0 4px 14px rgba(79, 70, 229, 0.28)) !important;
        color: #ffffff !important;
      }
      .sb-item.active {
        background: var(--sb-active-bg, var(--accent-soft)) !important;
        color: var(--sb-active-ink, var(--accent-deep)) !important;
        box-shadow: var(--sb-active-shadow, none) !important;
      }
      .sb-item.active svg {
        color: var(--sb-active-icon, var(--accent)) !important;
      }
      .sb-item.active::before {
        background: var(--btn-grad, var(--accent)) !important;
        width: 3.5px;
      }
      .sb-badge.accent {
        background: var(--btn-grad, var(--accent)) !important;
        color: #ffffff !important;
      }
      .kpi-card.accent {
        background: var(--kpi-featured-bg) !important;
        border-color: transparent !important;
        box-shadow: var(--kpi-featured-shadow, 0 12px 28px rgba(79, 70, 229, 0.28)) !important;
      }
      .kpi-card.accent .kpi-icon {
        background: rgba(255, 255, 255, 0.2) !important;
        color: #ffffff !important;
      }
      .kpi-card.accent .delta {
        background: rgba(255, 255, 255, 0.22) !important;
        color: #ffffff !important;
      }
      .bar-fill {
        background: var(--bar-grad, var(--accent)) !important;
      }
      .avatar {
        background: var(--btn-grad, var(--accent)) !important;
      }
      .kpi-icon.c1 { background: var(--ic1-bg, var(--accent-soft)); color: var(--ic1-ink, var(--accent)); }
      .kpi-icon.c2 { background: var(--ic2-bg, var(--accent-soft)); color: var(--ic2-ink, var(--accent)); }
      .kpi-icon.c3 { background: var(--ic3-bg, var(--accent-soft)); color: var(--ic3-ink, var(--accent)); }

      .palette-ribbon {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        color: var(--accent-deep);
        font-size: 11.5px;
        font-weight: 700;
        white-space: nowrap;
      }
      .swatch-dots { display: inline-flex; align-items: center; gap: 4px; }
      .swatch-dots i {
        width: 10px; height: 10px; border-radius: 50%;
        display: inline-block; border: 1px solid rgba(0, 0, 0, 0.12);
      }

      /* 3x2 Comparison Board */
      .cmp-stage {
        width: 1600px; height: 1040px; padding: 24px 28px;
        background: linear-gradient(135deg, #f5f7ff 0%, #f4f9fb 50%, #fdf6fb 100%);
        display: flex; flex-direction: column; gap: 16px;
      }
      .cmp-grid {
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
        gap: 16px; flex: 1; min-height: 0;
      }
      .cmp-card {
        background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
        overflow: hidden; display: flex; flex-direction: column;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }
      .cmp-thumb {
        flex: 1; min-height: 0; overflow: hidden; background: #f8fafc;
        border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; padding: 4px;
      }
      .cmp-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 8px; }
      .cmp-meta {
        padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      }
      .cmp-meta strong { font-family: Manrope, sans-serif; font-size: 13.5px; font-weight: 800; color: #0f172a; display: block; }
      .cmp-meta span { font-size: 11.5px; color: #64748b; }
    </style>
  </head>

          const q = new URLSearchParams(location.search);
          const id = q.get("palette") || "Y1-yorqin-indigo-binafsha";
          const stage = document.getElementById("stage");
          if (id === "compare") {
            stage.innerHTML = renderComparison();
          } else {
            const p = PALETTES[id] || PALETTES["Y1-yorqin-indigo-binafsha"];
            Object.entries(p.vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
