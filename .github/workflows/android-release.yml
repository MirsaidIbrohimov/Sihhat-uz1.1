name: Android APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'scripts/build-mobile-release.mjs'
      - 'scripts/mobile-tools.mjs'
      - 'scripts/check-apk-secrets.py'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: false

jobs:
  build-and-publish-apk:
    name: Build, Sign, and Publish APK to GitHub Releases (sihhat.uz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android signing secrets
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS) are not configured in GitHub Repository Secrets."
            echo "Add them in GitHub -> Settings -> Secrets and variables -> Actions to enable automatic signed APK publishing."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Read app version from pubspec.yaml
        id: version
        run: |
          node -e '
            const fs = require("node:fs");
            const pubspec = fs.readFileSync("apps/mobile/pubspec.yaml", "utf8");
            const m = /^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$/m.exec(pubspec);
            if (!m) throw new Error("Missing version in apps/mobile/pubspec.yaml");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_name=${m[1]}\nversion_code=${m[2]}\ntag=v${m[1]}-b${m[2]}\n`);
          '

      - name: Restore Android signing keystore in runner temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sihhat-release.jks"
          cat <<EOF > apps/mobile/android/key.properties
          storeFile=$RUNNER_TEMP/sihhat-release.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Flutter analyzer and support tests
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub test/support_test.dart

      - name: Build and verify signed release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          API_URL="${{ vars.SIHHAT_RELEASE_API_URL || 'https://sihhat-api.onrender.com' }}"
          SIHHAT_FLUTTER_BIN="$(command -v flutter)"
          export SIHHAT_FLUTTER_BIN
          node scripts/build-mobile-release.mjs "$API_URL"
          python3 scripts/check-apk-secrets.py .local/releases/sihhat-uz-release.apk
          cp .local/releases/sihhat-uz-release.apk .local/releases/sihhat-uz.apk
          cp .local/releases/sihhat-uz-release.apk ".local/releases/sihhat-uz-${{ steps.version.outputs.version_name }}.apk"
          sha256sum .local/releases/sihhat-uz.apk | awk '{print $1 "  sihhat-uz.apk"}' > .local/releases/SHA256SUMS.txt

      - name: Clean temporary signing files before release upload
        if: always()
        run: |
          rm -f apps/mobile/android/key.properties "$RUNNER_TEMP/sihhat-release.jks"

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sihhat.uz Android v${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
          body: |
            Rasmiy Sihhat.uz Android ilovasi (**v${{ steps.version.outputs.version_name }}**, build **${{ steps.version.outputs.version_code }}**).

            - API: `${{ vars.SIHHAT_RELEASE_API_URL || 'https://sihhat-api.onrender.com' }}`
            - To‘g‘ridan-to‘g‘ri yuklash (`sihhat.uz`): https://www.sihhat.uz/api/download/apk
            - Imzo va `check-apk-secrets.py` tekshiruvi CI orqali tasdiqlangan.
          make_latest: true
          files: |
            .local/releases/sihhat-uz.apk
            .local/releases/sihhat-uz-${{ steps.version.outputs.version_name }}.apk
            .local/releases/SHA256SUMS.txt
